# Gira sul mirror GitHub (fpellizz/fortyfax): quando la pipeline Bitbucket
# mirrora un tag v*, builda RPM (Fedora) e DEB (Debian) con gli strumenti
# nativi delle distro e crea la GitHub Release con gli artefatti allegati.
# Usa il GITHUB_TOKEN integrato, nessun segreto da configurare.
name: Release

on:
  push:
    tags: ['v*']
  # Lancio manuale (tab Actions > Release > Run workflow su un tag)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y rpm-build python3-devel desktop-file-utils rpmlint git tar
      - uses: actions/checkout@v4
      - name: Build RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./build-pkg.sh rpm
          rpmlint -r packaging/rpm/fortyfax.rpmlintrc dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  build-deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: apt-get update -qq && apt-get install -y -qq debhelper dpkg-dev lintian python3 git
      - uses: actions/checkout@v4
      - name: Build DEB
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./build-pkg.sh deb
          lintian --fail-on error dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/*.deb
          generate_release_notes: true
