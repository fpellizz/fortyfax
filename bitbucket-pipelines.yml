image: fedora:latest

definitions:
  steps:
    - step: &build-packages
        name: Build RPM & DEB
        script:
          # Install build dependencies
          - dnf install -y python3 ruby ruby-devel rpm-build gcc make rsync
          - gem install --no-document fpm

          # Extract version from source
          - export VERSION=$(python3 -c "import sys; sys.path.insert(0,'.'); from fortyfax import __version__; print(__version__)")
          - echo "Building Fortyfax v${VERSION}"

          # Build packages
          - chmod +x build-pkg.sh
          - ./build-pkg.sh

          # List generated packages
          - ls -lh dist/
        artifacts:
          - dist/*.rpm
          - dist/*.deb

    - step: &upload-downloads
        name: Upload to Bitbucket Downloads
        script:
          - ls -lh dist/
          # NOTE: --fail-with-body fa fallire lo step su errore HTTP (4xx/5xx)
          # mostrando la risposta del server nel log. Senza, curl esce con 0
          # anche se l'upload viene rifiutato (es. 401 per token non valido)
          # e la pipeline risulta verde senza aver pubblicato nulla.
          # Upload RPM
          - >
            curl --fail-with-body -X POST
            "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads"
            -F files=@"$(ls dist/*.rpm)"
            -u "${BB_AUTH_USER}:${BB_AUTH_TOKEN}"
          # Upload DEB
          - >
            curl --fail-with-body -X POST
            "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads"
            -F files=@"$(ls dist/*.deb)"
            -u "${BB_AUTH_USER}:${BB_AUTH_TOKEN}"
          # Verifica che i file risultino davvero pubblicati
          - >
            curl --fail-with-body -s
            "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads"
            -u "${BB_AUTH_USER}:${BB_AUTH_TOKEN}"
            | grep -o "\"name\": \"[^\"]*\"" || (echo "ERRORE: nessun file in Downloads" && exit 1)
          - echo "Packages uploaded to https://bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads/"

    - step: &mirror-github
        name: Mirror to GitHub
        clone:
          depth: full          # il clone shallow non basta per pushare la history
        script:
          # Mirror one-way: Bitbucket è la sorgente di verità, su GitHub
          # non si committa mai (verrebbe sovrascritto dal --force).
          - dnf install -y git    # fedora:latest non lo include
          - export MIRROR_URL="https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/fpellizz/fortyfax.git"
          - >
            if [ -n "${BITBUCKET_TAG:-}" ]; then
              git push --force "$MIRROR_URL" "refs/tags/${BITBUCKET_TAG}:refs/tags/${BITBUCKET_TAG}";
            else
              git push --force "$MIRROR_URL" "HEAD:refs/heads/${BITBUCKET_BRANCH}";
              git push --force --tags "$MIRROR_URL";
            fi

pipelines:
  # Build on every push (artifacts available for 14 days)
  default:
    - step: *build-packages

  # Master: build + mirror su GitHub
  branches:
    master:
      - step: *build-packages
      - step: *mirror-github

  # On tag push: build + upload to Downloads + mirror su GitHub
  tags:
    'v*':
      - step: *build-packages
      - step: *upload-downloads
      - step: *mirror-github

  # Manual trigger from any branch
  custom:
    release:
      - step: *build-packages
      - step: *upload-downloads
