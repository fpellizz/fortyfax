# CI Fortyfax: build pacchetti nativi (rpmbuild/dpkg-buildpackage),
# pubblicazione in Downloads sui tag, mirroring su GitHub.
image: fedora:latest

definitions:
  steps:
    - step: &build-rpm
        name: Build RPM (Fedora guidelines)
        image: fedora:latest
        script:
          - dnf install -y rpm-build python3-devel desktop-file-utils rpmlint git tar
          - ./build-pkg.sh rpm
          # Lint: fallisce su errori (i falsi positivi noti sono filtrati dal rpmlintrc)
          - rpmlint -r packaging/rpm/fortyfax.rpmlintrc dist/*.rpm
        artifacts:
          - dist/*.rpm

    - step: &build-deb
        name: Build DEB (Debian Policy)
        image: debian:bookworm
        script:
          - apt-get update -qq && apt-get install -y -qq debhelper dpkg-dev lintian python3
          - ./build-pkg.sh deb
          # Lint: fallisce solo su errori (i warning vengono mostrati nel log)
          - lintian --fail-on error dist/*.deb
        artifacts:
          - dist/*.deb

    - step: &upload-downloads
        name: Upload to Bitbucket Downloads
        script:
          - ls -lh dist/
          # NOTE: --fail-with-body fa fallire lo step su errore HTTP (4xx/5xx)
          # mostrando la risposta del server nel log. Senza, curl esce con 0
          # anche se l'upload viene rifiutato (es. 401 per token non valido)
          # e la pipeline risulta verde senza aver pubblicato nulla.
          # Upload RPM
          - >
            curl --fail-with-body -X POST
            "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads"
            -F files=@"$(ls dist/*.rpm)"
            -u "${BB_AUTH_USER}:${BB_AUTH_TOKEN}"
          # Upload DEB
          - >
            curl --fail-with-body -X POST
            "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads"
            -F files=@"$(ls dist/*.deb)"
            -u "${BB_AUTH_USER}:${BB_AUTH_TOKEN}"
          # Verifica che i file risultino davvero pubblicati
          - >
            curl --fail-with-body -s
            "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads"
            -u "${BB_AUTH_USER}:${BB_AUTH_TOKEN}"
            | grep -o "\"name\": \"[^\"]*\"" || (echo "ERRORE: nessun file in Downloads" && exit 1)
          - echo "Packages uploaded to https://bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads/"

    - step: &mirror-github
        name: Mirror to GitHub
        clone:
          depth: full          # il clone shallow non basta per pushare la history
        script:
          # Mirror one-way: Bitbucket è la sorgente di verità, su GitHub
          # non si committa mai (verrebbe sovrascritto dal --force).
          - dnf install -y git    # fedora:latest non lo include
          - export MIRROR_URL="https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/fpellizz/fortyfax.git"
          - >
            if [ -n "${BITBUCKET_TAG:-}" ]; then
              git push --force "$MIRROR_URL" "refs/tags/${BITBUCKET_TAG}:refs/tags/${BITBUCKET_TAG}";
            else
              git push --force "$MIRROR_URL" "HEAD:refs/heads/${BITBUCKET_BRANCH}";
              git push --force --tags "$MIRROR_URL";
            fi

pipelines:
  # Build su ogni push (artefatti disponibili 14 giorni)
  default:
    - parallel:
        - step: *build-rpm
        - step: *build-deb

  # Master: build + mirror su GitHub
  branches:
    master:
      - parallel:
          - step: *build-rpm
          - step: *build-deb
      - step: *mirror-github

  # Tag v*: build + upload in Downloads + mirror su GitHub
  tags:
    'v*':
      - parallel:
          - step: *build-rpm
          - step: *build-deb
      - step: *upload-downloads
      - step: *mirror-github
